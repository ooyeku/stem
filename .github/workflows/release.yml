name: Release

# Cut a release by pushing a version tag:
#
#     git tag v0.6.6 && git push origin v0.6.6
#
# Every target is cross-compiled on Linux — the same matrix the `cross`
# job in ci.yml already proves builds — then packaged with the bundled
# wasm plugins and attached to a GitHub Release. Pre-release tags (those
# containing a hyphen, e.g. v0.7.0-rc1) are marked as pre-releases.

on:
  push:
    tags:
      - 'v*'

# The publish job creates a Release, which needs write access to the
# repo's contents. Nothing else does.
permissions:
  contents: write

env:
  ZIG_VERSION: 0.16.0

jobs:
  build:
    name: build-${{ matrix.os_label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-macos, os_label: macos-aarch64 }
          - { target: x86_64-macos, os_label: macos-x86_64 }
          - { target: aarch64-linux-gnu, os_label: linux-aarch64 }
          - { target: x86_64-linux-gnu, os_label: linux-x86_64 }
          - { target: x86_64-windows-gnu, os_label: windows-x86_64, exe_suffix: .exe }
    steps:
      - uses: actions/checkout@v4

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build ReleaseFast for ${{ matrix.target }}
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Stage release tree
        run: |
          set -euo pipefail
          name="stem-${GITHUB_REF_NAME}-${{ matrix.os_label }}"
          stage="dist/${name}"
          mkdir -p "$stage"
          cp "zig-out/bin/stem${{ matrix.exe_suffix }}" "$stage/"
          cp README.md LICENSE "$stage/"
          # Bundled wasm plugins, laid out as the editor's plugin loader
          # expects: <root>/plugins/<name>/{plugin.json,<name>.wasm}. The
          # wasm is target-independent (wasm32-freestanding), so the
          # freshly built artifact in zig-out/bin is correct for every
          # target. Mirrors the layout install.sh writes under the prefix.
          for name in echo git-wasm plugin-manager-wasm; do
            mkdir -p "$stage/plugins/$name"
            cp "bundled/plugins/$name/plugin.json" "$stage/plugins/$name/"
            cp "zig-out/bin/$name.wasm" "$stage/plugins/$name/"
          done

      - name: Archive
        run: |
          set -euo pipefail
          name="stem-${GITHUB_REF_NAME}-${{ matrix.os_label }}"
          cd dist
          if [ -n "${{ matrix.exe_suffix }}" ]; then
            zip -r "${name}.zip" "$name"
          else
            tar -czf "${name}.tar.gz" "$name"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os_label }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: publish-release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.tar.gz *.zip | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Tags with a hyphen (v0.7.0-rc1, v1.0.0-beta) are pre-releases.
          prerelease=""
          case "${GITHUB_REF_NAME}" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            $prerelease
