      # - name: Push to homebrew-tap
      #   env:
      #     GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      #   run: |
      #     set -eux
      #     git clone "https://x-access-token:${GH_TOKEN}@github.com/ooyeku/homebrew-tap.git" tap
      #     mkdir -p tap/Formula
      #     cp dist/stem.rb tap/Formula/stem.rb
      #     cd tap
      #     git config user.email "ci@stem.local"
      #     git config user.name  "stem release bot"
